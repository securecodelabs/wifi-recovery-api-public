name: Release executable
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on this exact source revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yaml # zizmor: ignore[self-repository] -- Reuses the checked-out commit; no moving external action.
  publish:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, build and check the executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected vMAJOR.MINOR.PATCH' }
          $revision = git rev-parse "$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:SOURCE_SHA) { throw 'Tag does not identify this source revision' }
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.0 build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & ./target/release/wifi-recovery-api --version
          if ($version -ne "wifi-recovery-api $($env:RELEASE_TAG.Substring(1))") { throw 'Executable version differs from tag' }
          & ./target/release/wifi-recovery-api --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ./target/release/wifi-recovery-api dist/wifi-recovery-api-linux-amd64
          $hash = (Get-FileHash dist/wifi-recovery-api-linux-amd64 -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  wifi-recovery-api-linux-amd64" | Set-Content dist/wifi-recovery-api-linux-amd64.sha256 -Encoding utf8NoBOM
          "Source: $($env:SOURCE_SHA)`nRust 1.93.0; Linux amd64. Native executable with embedded license notices (--licenses). CPU contract checks passed; hosted CI does not test AMD hardware." | Set-Content dist/release-notes.md -Encoding utf8NoBOM
      - name: Test the exact packaged API with the real engine
        run: bash .github/engine-contract.sh dist/wifi-recovery-api-linux-amd64
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md dist/wifi-recovery-api-linux-amd64 dist/wifi-recovery-api-linux-amd64.sha256
